    <!-- Inicialet brenda rrethit -->
    <text x="50" y="59" font-family="Arial, sans-serif" font-weight="bold" font-size="32" fill="#ffffff" text-anchor="middle">BT</text>
    
    <!-- Vijë vizuale sipër -->
